<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <section id="feature13">
      <button id="fetchPromisesBtn">Fetch Data (Promises)</button>
      <div id="loadingPromises" style="display: none">Loading...</div>
      <ul id="dataPromises"></ul>
      <div id="errorPromises" style="color: crimson; margin-top: 6px"></div>
    </section>

    <section id="feature14" style="margin-top: 18px">
      <button id="fetchAsyncBtn">Fetch Data (Async/Await)</button>
      <div id="loadingAsync" style="display: none">Loading...</div>
      <ul id="dataAsync"></ul>
      <div id="errorAsync" style="color: crimson; margin-top: 6px"></div>
    </section>

    <section id="feature15" style="margin-top: 18px">
      <button id="loadParallelBtn">Load Data (Parallel)</button>
      <div id="loadingParallel" style="display: none">Loading...</div>
      <ul id="dataParallel"></ul>
      <div id="errorParallel" style="color: crimson; margin-top: 6px"></div>
    </section>

    <section id="switch_btn">
      <input type="text" id="input" />
      <button id="pay" style="display: none">pay</button>
      <button id="message" style="display: none">send message</button>
    </section>

    <script src="script.js"></script>
  </body>
</html>
